<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirackle — Support Report</title>
<meta name="theme-color" content="#FFFFFF">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{
  --paper:#FDFDFE;
  --ink:#0C0C10;
  --muted:#70707C;
  --faint:#9B9BA6;
  --red:#D9382C;
  --red-deep:#A32A21;
  --red-soft:rgba(217,56,44,.10);
  --glass:rgba(255,255,255,.62);
  --glass-2:rgba(255,255,255,.78);
  --stroke:rgba(12,12,16,.08);
  --stroke-2:rgba(12,12,16,.13);
  --shadow:0 8px 30px rgba(16,16,26,.09), 0 2px 8px rgba(16,16,26,.05);
  --shadow-lg:0 20px 50px rgba(16,16,26,.14), 0 4px 12px rgba(16,16,26,.06);
  --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --r:22px;
  --spring:cubic-bezier(.34,1.4,.5,1);
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  font-size:17px;line-height:1.5;letter-spacing:-.011em;
  min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
/* --- ambient light field --- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;
  animation:drift 26s ease-in-out infinite}
.b1{width:60vw;height:60vw;top:-22vw;left:-14vw;background:rgba(217,56,44,.30)}
.b2{width:48vw;height:48vw;top:32vh;right:-20vw;background:rgba(255,140,120,.24);animation-delay:-9s}
.b3{width:52vw;height:52vw;bottom:-24vw;left:12vw;background:rgba(217,56,44,.16);animation-delay:-17s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(4vw,-3vh) scale(1.08)}
  66%{transform:translate(-3vw,4vh) scale(.95)}}
/* faint hex weave, echoing the mark */
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='64' viewBox='0 0 56 64'><path d='M28 1L54 16v32L28 63 2 48V16z' fill='none' stroke='rgba(12,12,16,.045)' stroke-width='1.2'/></svg>");
  -webkit-mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent 80%);
          mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent 80%)}

.wrap{max-width:540px;margin:0 auto;padding:0 var(--pad)}
#app{animation:enter .42s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(253,253,254,.86),rgba(253,253,254,.55));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--stroke)}
.hbar{max-width:540px;margin:0 auto;padding:12px var(--pad);
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mk{height:30px;width:auto;display:block}
.brand .wd{height:13px;width:auto;display:block;margin-top:1px}
.lang{display:flex;gap:2px;padding:3px;border-radius:12px;
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--hi)}
.lang button{background:none;border:0;color:var(--muted);cursor:pointer;
  font:600 12.5px inherit;letter-spacing:.03em;padding:7px 12px;border-radius:9px;
  transition:all .3s var(--spring)}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff;
  box-shadow:0 3px 10px rgba(217,56,44,.32)}

.pix{display:flex;gap:4px;padding:0 var(--pad) 10px;max-width:540px;margin:0 auto}
.pix i{flex:1;height:3px;border-radius:3px;background:rgba(12,12,16,.09);
  transition:background .45s var(--spring),box-shadow .45s}
.pix i.on{background:var(--red);box-shadow:0 1px 6px rgba(217,56,44,.4)}

/* ---------- type ---------- */
h1{font-size:32px;line-height:1.1;letter-spacing:-.028em;font-weight:700;margin:30px 0 8px}
.sub{color:var(--muted);font-size:16px;margin:0 0 26px;max-width:42ch;letter-spacing:-.006em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--red);margin:0 0 8px}
label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.02em;
  color:var(--muted);margin:20px 0 8px}
label .r{color:var(--red);margin-left:3px}
.hint{font-size:13.5px;color:var(--faint);margin:7px 0 0;line-height:1.45}

/* ---------- glass fields ---------- */
input,select,textarea{width:100%;color:var(--ink);
  background:linear-gradient(168deg,rgba(255,255,255,.72),rgba(255,255,255,.34));
  border:1px solid rgba(255,255,255,.75);border-radius:16px;padding:15px;
  font:400 16px inherit;letter-spacing:-.01em;appearance:none;
  -webkit-backdrop-filter:blur(26px) saturate(210%);backdrop-filter:blur(26px) saturate(210%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(12,12,16,.05),
    inset 0 0 22px rgba(255,255,255,.35),
    0 3px 12px rgba(16,16,26,.07),
    0 1px 2px rgba(16,16,26,.04);
  transition:border-color .3s,box-shadow .3s,background .3s,transform .25s var(--spring)}
input::placeholder,textarea::placeholder{color:rgba(112,112,124,.6)}
textarea{min-height:112px;resize:vertical}
input:hover,select:hover,textarea:hover{
  background:linear-gradient(168deg,rgba(255,255,255,.8),rgba(255,255,255,.42))}
input:focus,select:focus,textarea:focus{outline:none;
  border-color:rgba(217,56,44,.55);
  background:linear-gradient(168deg,rgba(255,255,255,.86),rgba(255,255,255,.5));
  box-shadow:
    0 0 0 4px var(--red-soft),
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 0 22px rgba(255,255,255,.4),
    0 4px 16px rgba(217,56,44,.12)}
input.bad{border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5l5 5 5-5' stroke='%2370707C' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center}

/* ---------- glass tiles ---------- */
.card{position:relative;overflow:hidden;display:flex;gap:15px;align-items:center;width:100%;
  text-align:left;color:var(--ink);font:400 16px inherit;cursor:pointer;margin-bottom:11px;
  padding:18px 19px;border-radius:var(--r);border:1px solid var(--stroke);
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--shadow),var(--hi);
  transition:transform .45s var(--spring),box-shadow .35s,border-color .3s}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.6) 48%,transparent 62%);
  transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.7,.3,1)}
.card:hover::after{transform:translateX(120%)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg),var(--hi);border-color:var(--stroke-2)}
.card:active{transform:scale(.982)}
.card .n{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--red-soft);color:var(--red);font:600 12.5px inherit;letter-spacing:.02em}
.card b{display:block;font-weight:600;font-size:17px;letter-spacing:-.018em;margin-bottom:2px}
.card small{color:var(--muted);font-size:13.5px;line-height:1.4;display:block;letter-spacing:-.004em}

.opt{position:relative;display:flex;align-items:center;gap:13px;cursor:pointer;
  padding:15px 16px;margin-bottom:9px;border-radius:16px;font-size:16px;
  background:var(--glass-2);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--hi);transition:all .38s var(--spring)}
.opt:active{transform:scale(.985)}
.opt[data-on="1"]{border-color:rgba(217,56,44,.42);background:linear-gradient(150deg,rgba(217,56,44,.09),var(--glass-2));
  box-shadow:0 6px 20px rgba(217,56,44,.14),var(--hi)}
.opt .box{width:22px;height:22px;border:1.8px solid rgba(12,12,16,.2);border-radius:50%;
  flex:none;position:relative;transition:all .35s var(--spring)}
.opt[data-on="1"] .box{background:var(--red);border-color:var(--red);
  box-shadow:0 2px 8px rgba(217,56,44,.4)}
.opt[data-on="1"] .box::after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);animation:pop .3s var(--spring)}
@keyframes pop{from{transform:rotate(45deg) scale(0)}to{transform:rotate(45deg) scale(1)}}

/* ---------- buttons ---------- */
button.primary{position:relative;overflow:hidden;width:100%;border:0;cursor:pointer;
  margin-top:28px;padding:18px;border-radius:17px;color:#fff;
  background:linear-gradient(180deg,#E24438,var(--red-deep));
  font:600 16.5px inherit;letter-spacing:-.01em;
  box-shadow:0 10px 26px rgba(217,56,44,.34),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .45s var(--spring),box-shadow .35s,filter .3s}
button.primary::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.35) 50%,transparent 68%);
  transform:translateX(-120%);transition:transform .85s cubic-bezier(.2,.7,.3,1)}
button.primary:hover::after{transform:translateX(120%)}
button.primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(217,56,44,.4),inset 0 1px 0 rgba(255,255,255,.3)}
button.primary:active{transform:scale(.975)}
button.primary:disabled{background:rgba(12,12,16,.07);color:var(--faint);box-shadow:none;
  cursor:not-allowed;transform:none}
button.primary:disabled::after{display:none}
button.ghost{width:100%;cursor:pointer;margin-top:11px;padding:15px;border-radius:17px;
  color:var(--muted);background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  font:600 14.5px inherit;letter-spacing:-.005em;box-shadow:var(--hi);
  transition:all .4s var(--spring)}
button.ghost:hover{color:var(--ink);border-color:var(--stroke-2);transform:translateY(-1px)}
button.ghost:active{transform:scale(.98)}
.two{display:flex;gap:11px}.two>*{flex:1;min-width:0}

/* ---------- wall grid ---------- */
.stage{perspective:1000px;margin-top:14px}
.gridwrap{padding:20px 18px 24px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--shadow-lg),var(--hi);
  transform:rotateX(8deg);transform-origin:50% 100%}
.gridbox{display:grid;gap:3px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:4px;cursor:pointer;
  background:rgba(12,12,16,.05);border:1px solid rgba(12,12,16,.08);
  transition:all .3s var(--spring)}
.cell:hover{background:rgba(12,12,16,.1)}
.cell[data-on="1"]{background:var(--red);border-color:var(--red);
  box-shadow:0 3px 10px rgba(217,56,44,.42);transform:scale(1.06)}
.floor{height:20px;width:72%;margin:2px auto 0;
  background:radial-gradient(60% 100% at 50% 0,rgba(217,56,44,.18),transparent 72%);filter:blur(3px)}

/* ---------- media ---------- */
.shot{display:flex;gap:13px;align-items:center;padding:14px;margin-bottom:10px;border-radius:18px;
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow),var(--hi);transition:all .4s var(--spring)}
.shot.done{border-color:rgba(217,56,44,.35)}
.thumb{width:58px;height:58px;border-radius:13px;object-fit:cover;flex:none;
  background:rgba(12,12,16,.05);border:1px solid var(--stroke);display:grid;place-items:center}
.thumb svg{opacity:.3}
.shot .t{flex:1;min-width:0}
.shot b{display:block;font-weight:600;font-size:15px;letter-spacing:-.015em}
.shot small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
.shot input{display:none}
.pick{flex:none;cursor:pointer;padding:11px 15px;border-radius:12px;
  color:var(--red);background:var(--red-soft);border:1px solid rgba(217,56,44,.2);
  font:600 13px inherit;letter-spacing:-.005em;transition:all .38s var(--spring)}
.pick:hover{background:var(--red);color:#fff;border-color:var(--red);
  box-shadow:0 5px 16px rgba(217,56,44,.32)}
.pick:active{transform:scale(.94)}

/* ---------- panels ---------- */
.rev{padding:4px 20px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:var(--shadow),var(--hi)}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;
  border-bottom:1px solid var(--stroke);font-size:15.5px}
.row:last-child{border:0}
.row span:first-child{color:var(--muted);flex:none;font-size:13.5px}
.row span:last-child{text-align:right;word-break:break-word;font-weight:500;letter-spacing:-.01em}
.seal{display:grid;place-items:center;padding:20px 0 6px;animation:seal .7s var(--spring) both}
@keyframes seal{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.seal .ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),var(--red-soft));
  border:1px solid rgba(217,56,44,.25);box-shadow:0 14px 40px rgba(217,56,44,.22),var(--hi)}
.tid{font:600 25px ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  letter-spacing:.02em;text-align:center;margin:14px 0 24px;color:var(--ink)}
.note{padding:16px 18px;border-radius:18px;margin-top:22px;font-size:14.5px;line-height:1.55;
  color:var(--muted);background:linear-gradient(150deg,rgba(217,56,44,.07),var(--glass));
  border:1px solid var(--stroke);border-left:3px solid var(--red);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
details{margin-top:20px}
summary{color:var(--muted);font-size:13.5px;cursor:pointer}
pre{padding:15px;border-radius:15px;margin-top:10px;max-height:250px;overflow:auto;
  font:500 11.5px ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  color:var(--muted);background:var(--glass-2);border:1px solid var(--stroke)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--faint);font-size:12.5px;padding:32px 0 8px;letter-spacing:.01em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .gridwrap{transform:none}}
</style>
</head>

/* internal triage — never shown to the customer, never in the PDF */
function priority(){const d=S.det;
  if(S.cat==="cfg"&&d.sym===1)return "critical";
  if(S.cat==="hw"&&(d.sym===3||d.sym===5))return "critical";
  if(S.cat==="ship"&&d.what===3)return "critical";
  if(S.grid.sel.length>3)return "high";
  if(S.cat==="ship"||S.cat==="asm")return "high";
  if(S.cat==="hw"&&d.sym===1)return "low";
  return "medium"}
const warranty=()=>S.cat==="hw"||(S.cat==="ship"&&S.det.what!==3);
const makeTicket=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `MRK-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`};

function compress(file,maxPx=1500,q=.72){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{let{width:w,height:h}=img;const s=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    const pdfUrl=c.toDataURL("image/jpeg",.78);
    c.toBlob(b=>res({dataUrl:c.toDataURL("image/jpeg",.4),pdfUrl,blob:b,type:"image",w,h}),"image/jpeg",q)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
function videoDuration(f){return new Promise(res=>{const v=document.createElement("video");
  v.preload="metadata";v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);res(v.duration)};
  v.onerror=()=>res(0);v.src=URL.createObjectURL(f)})}

function issueLines(dict){
  const d=S.det,A=k=>dict[k],L=[];
  if(S.cat==="ship"){L.push([dict.ship_what,A("ship_a")[d.what]]);
    L.push([dict.ship_items,d.items]);L.push([dict.ship_noted,[dict.yes,dict.no,dict.unsure][d.noted]])}
  if(S.cat==="asm"){L.push([dict.asm_stage,A("asm_a")[d.stage]]);
    L.push([dict.asm_mount,A("asm_m")[d.mount]]);L.push([dict.where_d,d.notes])}
  if(S.cat==="cfg"){L.push([dict.cfg_sym,A("cfg_a")[d.sym]]);
    L.push([dict.cfg_proc,d.proc]);L.push([dict.cfg_file,[dict.yes,dict.no,dict.unsure][d.cfgfile]])}
  if(S.cat==="hw"){L.push([dict.hw_sym,A("hw_a")[d.sym]]);
    L.push([dict.when,A("hw_when")[d.when]]);L.push([dict.where_d,d.notes])}
  if(S.cat==="oth")L.push([dict.oth_desc,d.notes]);
  return L}

    "","— CUSTOMER —",
    `Company: ${S.id.company||"-"}`,`Invoice / Order: ${S.id.order||"-"}`,
    `Contact: ${S.id.contact||"-"}`,`Email: ${S.id.email||"-"}   Phone: ${S.id.phone||"-"}`,
    `Purchase date: ${S.id.purchase||"-"}`,`Site: ${S.id.site||"-"}`,`Panel model: ${S.id.model||"-"}`,
    "","— ISSUE —");
  issueLines(E).forEach(([k,v])=>L.push(`${k}: ${v||"-"}`));
  if(S.grid.cols)L.push("",`— WALL LAYOUT — ${S.grid.cols} across x ${S.grid.rows} high`,
    `Affected cabinets (${S.grid.sel.length}): ${S.grid.sel.join(", ")||"none marked"}`);
  const f=Object.keys(S.media);
  L.push("",`— MEDIA — ${f.length} file(s): ${f.join(", ")||"none"}`);
  return L.join("\n")}

async function buildPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=18,RED=[217,56,44],INK=[12,12,16],MUT=[112,112,124];
  let y=0;

  const footer=(n)=>{doc.setDrawColor(230,230,234);doc.line(M,H-16,W-M,H-16);
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...MUT);
    doc.text("mirackle.us   ·   "+SUPPORT_EMAIL,M,H-11);
    doc.text(`${t("p_page")} ${n}`,W-M,H-11,{align:"right"})};

  const head=()=>{
    doc.setFillColor(250,250,251);doc.rect(0,0,W,42,"F");
    doc.setFillColor(...RED);doc.rect(0,42,W,1.1,"F");
    try{doc.addImage(LOGO_MARK,"PNG",M,10,17.5,20)}catch(e){}
    try{doc.addImage(LOGO_WORD,"PNG",M+22,19.5,44,4.8)}catch(e){}
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...INK);
    doc.text(t("p_title"),W-M,17,{align:"right"});
    doc.setFont("courier","bold");doc.setFontSize(13);doc.setTextColor(...RED);
    doc.text(S.ticket,W-M,25,{align:"right"});
    doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...MUT);
    doc.text(`${t("p_sub")}: ${new Date().toLocaleString()}`,W-M,31,{align:"right"});
    y=56};

  const section=(title)=>{
    if(y>H-46){footer(doc.getNumberOfPages());doc.addPage();head()}
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(...RED);
    doc.text(title.toUpperCase(),M,y);
    doc.setDrawColor(...RED);doc.setLineWidth(.4);doc.line(M,y+1.8,M+11,y+1.8);
    y+=9};

  const kv=(k,v)=>{
    if(y>H-28){footer(doc.getNumberOfPages());doc.addPage();head()}
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...MUT);
    doc.text(String(k),M,y);
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...INK);
    const txt=doc.splitTextToSize(String(v||t("p_none")),W-M-M-52);
    doc.text(txt,M+52,y);
    y+=Math.max(7,txt.length*4.9)+1.2;
    doc.setDrawColor(238,238,242);doc.setLineWidth(.2);doc.line(M,y-3,W-M,y-3)};

  head();

  section(t("cat_l"));
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(...INK);
  doc.text(doc.splitTextToSize(t("c_"+S.cat),W-2*M),M,y);y+=13;

  section(t("p_cust"));
  kv(t("f_company"),S.id.company); kv(t("f_order"),S.id.order);
  kv(t("f_contact"),S.id.contact); kv(t("f_email"),S.id.email);
  kv(t("f_phone"),S.id.phone);     kv(t("f_purchase"),S.id.purchase);
  kv(t("f_site"),S.id.site);       kv(t("f_model"),S.id.model);
  y+=5;

  section(t("p_issue"));
  issueLines(T[lang]).forEach(([k,v])=>kv(k,v));
  y+=5;

  if(S.grid.cols){
    section(t("p_wall"));
    kv(t("g_cols")+" / "+t("g_rows"),`${S.grid.cols} × ${S.grid.rows}`);
    kv(t("g_sel"),S.grid.sel.join(", ")||"—");
    const maxW=W-2*M-10, cs=Math.min(9,maxW/S.grid.cols);
    const gw=cs*S.grid.cols, gx=(W-gw)/2;
    if(y+cs*S.grid.rows>H-30){footer(doc.getNumberOfPages());doc.addPage();head()}
    y+=3;
    for(let r=1;r<=S.grid.rows;r++)for(let c=1;c<=S.grid.cols;c++){
      const on=S.grid.sel.includes(`R${r}C${c}`);
      on?doc.setFillColor(...RED):doc.setFillColor(243,243,246);
      doc.setDrawColor(222,222,228);doc.setLineWidth(.2);
      doc.rect(gx+(c-1)*cs,y+(r-1)*cs,cs-.8,cs-.8,"FD")}
    y+=cs*S.grid.rows+10}

  const photos=Object.entries(S.media).filter(([k,m])=>m.type==="image");
  if(photos.length){
    footer(doc.getNumberOfPages());doc.addPage();head();
    section(t("p_photos"));
    for(const [k,m] of photos){
      const capH=7, boxW=W-2*M, ratio=m.h/m.w;
      let iw=boxW, ih=iw*ratio;
      if(ih>105){ih=105;iw=ih/ratio}
      if(y+ih+capH>H-24){footer(doc.getNumberOfPages());doc.addPage();head();section(t("p_photos"))}
      doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...INK);
      doc.text(m.name||k,M,y);y+=3.5;
      try{doc.addImage(m.pdfUrl,"JPEG",M+(boxW-iw)/2,y,iw,ih)}catch(e){}
      doc.setDrawColor(224,224,230);doc.setLineWidth(.3);
      doc.rect(M+(boxW-iw)/2,y,iw,ih);
      y+=ih+11}}

  if(S.media.video){
    if(y>H-34){footer(doc.getNumberOfPages());doc.addPage();head()}
    doc.setFillColor(253,244,243);doc.setDrawColor(...RED);doc.setLineWidth(.4);
    doc.roundedRect(M,y,W-2*M,15,2.5,2.5,"FD");
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...RED);
    doc.text(`${t("p_video")} — ${S.media.video.seconds}s`,M+6,y+9);
    y+=22}

  footer(doc.getNumberOfPages());
  return doc}

async function makePdfBlob(){
  if(!window.jspdf)return null;
  try{const d=await buildPDF();return d.output("blob")}catch(e){console.error(e);return null}}

/* ================= review / submit / done ================= */
function scrRev(){
  if(!S.ticket)S.ticket=makeTicket();
  app.innerHTML=`<h1>${t("rev_t")}</h1><p class="sub">${t("rev_s")}</p>
    <div class="rev">
      <div class="row"><span>${t("cat_l")}</span><span>${t("c_"+S.cat)}</span></div>
      <div class="row"><span>${t("f_company")}</span><span>${esc(S.id.company)}</span></div>
      <div class="row"><span>${t("f_order")}</span><span>${esc(S.id.order)}</span></div>
      ${S.id.model?`<div class="row"><span>${t("f_model")}</span><span>${esc(S.id.model)}</span></div>`:""}
      ${S.grid.sel.length?`<div class="row"><span>${t("grid_t")}</span><span>${S.grid.sel.join(", ")}</span></div>`:""}
      <div class="row"><span>${t("med_t")}</span><span>${Object.keys(S.media).length}</span></div>
    </div>`;
  const n=el(`<button class="primary">${t("send")}</button>`);n.onclick=()=>submit(n);app.appendChild(n);
  const b=el(`<button class="ghost">${t("back")}</button>`);b.onclick=()=>go(4);app.appendChild(b)}

async function submit(btn){
  btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${t("sending")}`;
  S.pdfBlob=await makePdfBlob();
  const fd=new FormData();
  fd.append("ticket",S.ticket);fd.append("priority",priority());fd.append("category",S.cat);
  fd.append("warranty",warranty()?"1":"0");fd.append("company",S.id.company||"");
  fd.append("invoice",S.id.order||"");fd.append("lang",lang);
  fd.append("payload",JSON.stringify({id:S.id,det:S.det,grid:S.grid}));
  fd.append("report",reportText());
  if(S.pdfBlob)fd.append("file_report_pdf",S.pdfBlob,S.ticket+".pdf");
  Object.entries(S.media).forEach(([k,m])=>fd.append("file_"+k,m.blob,k+(m.type==="video"?".mp4":".jpg")));
  try{const r=await fetch(API_ENDPOINT,{method:"POST",body:fd});if(!r.ok)throw 0;S.fallback=false}
  catch{S.fallback=true}
  go(6)}

function downloadPdf(btn){
  if(!S.pdfBlob){btn.textContent=t("pdf_wait");return}
  const u=URL.createObjectURL(S.pdfBlob),a=document.createElement("a");
  a.href=u;a.download=S.ticket+".pdf";a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}

function scrDone(){
  const pdfBtn=()=>{const p=el(`<button class="${S.fallback?"primary":"ghost"}">${t("pdf")}</button>`);
    p.onclick=()=>downloadPdf(p);return p};
  if(S.fallback){
    const subj=encodeURIComponent(`[${priority().toUpperCase()}] ${S.ticket} — ${T.en["c_"+S.cat]} — ${S.id.company||""} — INV ${S.id.order||""}`);
    const body=encodeURIComponent(reportText());
    app.innerHTML=`<h1>${t("fb_t")}</h1><p class="sub">${t("fb_s")}</p><div class="tid">${S.ticket}</div>`;
    app.appendChild(pdfBtn());
    const m=el(`<button class="ghost">${t("email_btn")}</button>`);
    m.onclick=()=>location.href=`mailto:${SUPPORT_EMAIL}?subject=${subj}&body=${body}`;app.appendChild(m);
    const c=el(`<button class="ghost">${t("copy")}</button>`);
    c.onclick=async()=>{try{await navigator.clipboard.writeText(reportText());c.textContent=t("copied")}catch{}};
    app.appendChild(c);
    app.appendChild(el(`<details><summary>${t("fb_show")}</summary><pre>${esc(reportText())}</pre></details>`));
    return}
  app.innerHTML=`
    <div class="seal"><div class="ring">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#D9382C" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.6l4.6 4.6L19.5 6.8"/></svg>
    </div></div>
    <h1 style="text-align:center;margin-top:10px">${t("done_t")}</h1>
    <p class="sub" style="text-align:center;margin-inline:auto">${t("done_s")}</p>
    <div class="tid">${S.ticket}</div>
    <div class="rev">
      <div class="row"><span>${t("cat_l")}</span><span>${t("c_"+S.cat)}</span></div>
      <div class="row"><span>${t("f_company")}</span><span>${esc(S.id.company)}</span></div>
      <div class="row"><span>${t("f_order")}</span><span>${esc(S.id.order)}</span></div>
    </div>`;
  app.appendChild(pdfBtn());
  app.appendChild(el(`<div class="note">${t("done_note")}<br><br>${t("done_call")}</div>`))}

function render(){pix();({0:scrCat,1:scrId,2:scrDet,3:scrGrid,4:scrMedia,5:scrRev,6:scrDone})[S.step]()}
render();
</script>
